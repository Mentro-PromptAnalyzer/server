name: mentro-server-local

services:
  fixture:
    build:
      context: .
      target: fixture
    image: mentro-fixture-local:${MENTRO_REVISION:?Set MENTRO_REVISION to the current Git commit SHA}
    init: true
    read_only: true
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    cpus: 0.25
    mem_limit: 128m
    networks:
      - pilot
    restart: unless-stopped
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  mentro-server:
    build:
      context: .
      args:
        VCS_REF: ${MENTRO_REVISION:?Set MENTRO_REVISION to the current Git commit SHA}
    image: mentro-server-local:${MENTRO_REVISION:?Set MENTRO_REVISION to the current Git commit SHA}
    depends_on:
      fixture:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: '3001'
      SUPABASE_URL: http://fixture:3004
      SUPABASE_ANON_KEY: local-fixture-anon
      MENTRO_FIXTURE_ORIGIN: http://fixture:3004
      MENTRO_INFERENCE_TIMEOUT_MS: '2000'
      GROQ_API_KEY: fixture-groq
      CEREBRAS_API_KEY: fixture-cerebras
      TOGETHER_API_KEY: fixture-together
      GEMINI_API_KEY: fixture-gemini
      PERPLEXITY_API_KEY: fixture-perplexity
    ports:
      - '127.0.0.1:${MENTRO_PORT:-3001}:3001'
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    shm_size: 256m
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    networks:
      - pilot
      - preview
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  pilot:
    internal: true
  preview: {}
